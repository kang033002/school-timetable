<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마스터 개발자 포털 (Master Developer Portal)</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --text-sub: #64748b;
      --primary-color: #3b82f6;
      --border-color: #e2e8f0;
      --success-color: #10b981;
      --danger-color: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .screen { width: 100%; display: flex; justify-content: center; align-items: center; }
    .hidden { display: none !important; }

    /* Login Box */
    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 2.5rem;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .login-header { text-align: center; margin-bottom: 2rem; }
    .logo-icon { font-size: 3rem; margin-bottom: 0.5rem; }
    h2 { font-size: 1.5rem; margin-bottom: 0.5rem; font-weight: 700; }
    
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-sub); }
    .form-input {
      width: 100%;
      background: #f1f5f9;
      border: 1px solid var(--border-color);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      color: var(--text-color);
      font-size: 0.95rem;
    }
    .form-input:focus { outline: none; border-color: var(--primary-color); }
    .btn {
      cursor: pointer;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      border: none;
      transition: all 0.2s ease;
      font-size: 0.95rem;
    }
    .btn-primary { background: var(--primary-color); color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-block { width: 100%; display: block; }
    .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.8rem; border-radius: 6px; }
    .btn-success { background: var(--success-color); color: white; }
    .btn-danger { background: var(--danger-color); color: white; }

    /* Dashboard */
    .dashboard-container {
      width: 100%;
      max-width: 1300px;
      overflow-x: auto;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      margin: 2rem;
    }
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }
    th { color: var(--text-sub); font-weight: 600; font-size: 0.9rem; }
    
    .badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-pending { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
    .badge-approved { background: rgba(16, 185, 129, 0.15); color: #10b981; }

    .action-cell { display: flex; gap: 0.5rem; }
  </style>
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="screen">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-icon">🔑</div>
        <h2>개발자 마스터 로그인</h2>
        <p>신규 학교 가입 승인 및 관리자 권한 제어</p>
      </div>
      <form id="login-form" autocomplete="off">
        <div class="form-group">
          <label>마스터 아이디</label>
          <input type="text" id="login-email" class="form-input" required placeholder="마스터 아이디" autocomplete="off">
        </div>
        <div class="form-group">
          <label>비밀번호</label>
          <input type="password" id="login-password" class="form-input" required placeholder="••••••••" autocomplete="new-password">
        </div>
        <div id="api-config-section" class="form-group hidden" style="margin-top: 1rem; border-top: 1px dashed var(--border-color); padding-top: 1rem; text-align: left;">
          <label style="color:var(--text-sub); font-size:0.8rem;">🔧 백엔드 서버 주소 설정 (모바일)</label>
          <input type="text" id="api-server-url" class="form-input" style="font-size:0.85rem;" placeholder="예: http://192.168.0.10:3000">
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">마스터 로그인</button>
      </form>
    </div>
  </div>

  <!-- Dashboard Screen -->
  <div id="dashboard-screen" class="screen hidden">
    <div class="dashboard-container">
      <div class="dashboard-header">
        <div>
          <h2>🛠️ 마스터 개발자 시스템 포털</h2>
          <p style="color: var(--text-sub); font-size: 0.85rem; margin-top: 0.25rem;">전체 가입 신청 학교 관리 및 승인 절차 제어</p>
        </div>
        <div style="display: flex; gap: 0.5rem; align-items: center;">
          <button id="btn-logout" class="btn btn-danger btn-sm">마스터 로그아웃</button>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h3 style="margin-bottom: 0;">🏫 가입 신청 학교 목록</h3>
        <div style="display: flex; gap: 0.5rem;">
          <button id="btn-delete-selected" class="btn btn-danger btn-sm">선택 삭제</button>
          <button id="btn-delete-all" class="btn btn-danger btn-sm">전체 삭제</button>
        </div>
      </div>
      <table style="margin-bottom: 2rem;">
        <thead>
          <tr>
            <th style="width: 40px; text-align: center;"><input type="checkbox" id="check-all-schools"></th>
            <th>학교명</th>
            <th>학교 고유 ID</th>
            <th>학교 코드</th>
            <th>관리자 ID</th>
            <th>비밀번호</th>
            <th>승인 상태</th>
            <th>작업</th>
          </tr>
        </thead>
        <tbody id="schools-list-ui">
          <!-- Dynamic school rows -->
        </tbody>
      </table>

      <!-- Master Credentials Change Form Card -->
      <div style="background: var(--bg-card); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border-color); max-width: 500px; margin-top: 2rem;">
        <h3 style="margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">🔑 마스터 로그인 정보 변경</h3>
        <form id="master-credentials-form">
          <div class="form-group">
            <label>새 마스터 아이디</label>
            <input type="text" id="new-master-username" class="form-input" required placeholder="새 아이디">
          </div>
          <div class="form-group">
            <label>새 마스터 비밀번호</label>
            <input type="password" id="new-master-password" class="form-input" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-primary btn-block">로그인 정보 변경 저장</button>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js?v=2"></script>
</body>
</html>
