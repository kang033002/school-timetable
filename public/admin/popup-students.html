<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>🎓 가입 완료 학생 관리</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3.0">
  <style>
    body { padding: 2rem; background: var(--bg-main); color: var(--text-main); font-family: 'Pretendard', sans-serif; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
    h2 { margin: 0; }
    .main-grid { display: grid; grid-template-columns: 1.2fr 1.8fr; gap: 2rem; }
    .btn-danger { background: var(--danger-color, #dc2626); color: white; border: none; }
    .btn-danger:hover { background: #b91c1c; }
  </style>
</head>
<body>
  <div class="header">
    <h2>🎓 가입 완료 학생 관리</h2>
    <button class="btn btn-outline" onclick="window.close()">창 닫기</button>
  </div>

  <div class="main-grid">
    <!-- Left Column: Bulk Add Student Rows -->
    <div class="settings-card" style="margin: 0; box-shadow: none; border: 1px solid var(--border-color); display:flex; flex-direction:column; gap:1.5rem;">
      <div>
        <h4 style="margin:0 0 0.5rem 0;">🎓 학생 신규 직접 등록 (자동가입)</h4>
        <p style="font-size:0.82rem; color:var(--text-muted); margin:0;">관리자가 학생들을 신규 등록하면 아이디가 자동 생성(s학년반번호)되며 임시 비밀번호(1234)가 부여됩니다.</p>
      </div>

      <div class="table-responsive" style="max-height: 350px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 6px;">
        <table class="logs-table" style="margin:0;">
          <thead>
            <tr>
              <th style="width: 70px;">학년</th>
              <th style="width: 70px;">반</th>
              <th>이름</th>
              <th style="width: 50px; text-align:center;">삭제</th>
            </tr>
          </thead>
          <tbody id="student-input-rows">
            <!-- Dynamic Input Rows -->
          </tbody>
        </table>
      </div>

      <div style="display:flex; gap:0.5rem;">
        <button type="button" class="btn btn-outline" onclick="addStudentInputRow()" style="flex:1;">➕ 행 추가</button>
        <button type="button" class="btn btn-primary" onclick="submitNewStudents()" style="flex:1.5;">⚡ 학생 일괄 생성 완료</button>
      </div>
    </div>

    <!-- Right Column: Approved Students List -->
    <div class="settings-card" style="margin: 0; box-shadow: none; border: 1px solid var(--border-color); display:flex; flex-direction:column; gap:1rem;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h4 style="margin:0;">🎓 가입 완료 학생 목록</h4>
        <div style="display:flex; gap:0.5rem;">
          <button class="btn btn-sm btn-outline btn-danger" id="btn-delete-selected-students" style="padding:0.4rem 0.8rem; border-radius:4px;">선택 삭제</button>
          <button class="btn btn-sm" id="btn-delete-all-students" style="background:#b91c1c; color:white; border:none; padding:0.4rem 0.8rem; border-radius:4px;">전체 삭제</button>
        </div>
      </div>

      <div class="table-responsive" style="max-height: 450px; overflow-y: auto;">
        <table class="logs-table">
          <thead>
            <tr>
              <th style="width: 40px; text-align: center;"><input type="checkbox" id="chk-select-all-students"></th>
              <th>학년</th>
              <th>반</th>
              <th>이름</th>
              <th>아이디</th>
              <th>비밀번호</th>
            </tr>
          </thead>
          <tbody id="approved-students-list">
            <!-- Loaded via js -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const opener = window.opener;
    if (!opener) {
      alert('올바르지 않은 접근입니다.');
      window.close();
    }

    // Load Approved Students List
    async function loadApprovedStudents() {
      const listEl = document.getElementById('approved-students-list');
      listEl.innerHTML = '<tr><td colspan="6" style="text-align:center;">불러오는 중...</td></tr>';

      try {
        const res = await fetch(`${opener.API_BASE}/admin/users/approved-students?schoolId=${opener.currentUser.schoolId}`);
        const students = await res.json();
        listEl.innerHTML = '';

        if (!students || students.length === 0) {
          listEl.innerHTML = '<tr><td colspan="6" style="text-align:center;">가입 완료된 학생이 없습니다.</td></tr>';
          return;
        }

        students.forEach(s => {
          // Parse student actual name from displayName if format is "이름 (Grade학년 ClassNumber반 학생)"
          let displayName = s.name || '';
          let actualName = displayName.split(' (')[0];

          // Parse grade/class from database or fallback to display name parsing
          let gradeVal = s.grade;
          let classVal = s.class_number;

          if (!gradeVal || !classVal) {
            const match = displayName.match(/\\((\\d+)학년\\s+(\\d+)반/);
            if (match) {
              gradeVal = match[1];
              classVal = match[2];
            }
          }

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="text-align: center;"><input type="checkbox" class="student-checkbox" value="${s.id}"></td>
            <td><strong>${gradeVal || '-'}학년</strong></td>
            <td><strong>${classVal || '-'}반</strong></td>
            <td><strong>${actualName}</strong></td>
            <td><span style="color:var(--text-muted); font-size:0.88rem;">${s.email}</span></td>
            <td><code style="background:var(--bg-card); padding:2px 5px; border-radius:3px;">${s.password_hash}</code></td>
          `;
          listEl.appendChild(tr);
        });
      } catch (err) {
        console.error(err);
        listEl.innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">불러오기 실패</td></tr>';
      }
    }

    // Dynamic Row Adding
    let rowIdCounter = 0;
    function addStudentInputRow() {
      const tbody = document.getElementById('student-input-rows');
      const tr = document.createElement('tr');
      const currentId = `row-${rowIdCounter++}`;
      tr.id = currentId;
      tr.innerHTML = `
        <td><input type="number" class="form-input row-grade" min="1" max="6" style="padding:0.3rem; text-align:center;" required placeholder="1"></td>
        <td><input type="number" class="form-input row-class" min="1" max="20" style="padding:0.3rem; text-align:center;" required placeholder="1"></td>
        <td><input type="text" class="form-input row-name" style="padding:0.3rem;" required placeholder="홍길동"></td>
        <td style="text-align:center;"><button type="button" class="btn btn-sm btn-outline" onclick="removeInputRow('${currentId}')" style="color:var(--danger-color); padding:0.2rem 0.5rem;">&times;</button></td>
      `;
      tbody.appendChild(tr);
    }

    function removeInputRow(id) {
      const row = document.getElementById(id);
      if (row) row.remove();
    }

    // Initialize with 3 empty rows
    for(let i=0; i<3; i++) {
      addStudentInputRow();
    }

    // Submit Students to Server
    async function submitNewStudents() {
      const grades = document.querySelectorAll('.row-grade');
      const classes = document.querySelectorAll('.row-class');
      const names = document.querySelectorAll('.row-name');

      const students = [];
      for (let i = 0; i < grades.length; i++) {
        const grade = parseInt(grades[i].value);
        const classNumber = parseInt(classes[i].value);
        const name = names[i].value.trim();

        if (grade && classNumber && name) {
          students.push({ grade, classNumber, name });
        }
      }

      if (students.length === 0) {
        alert('학년, 반, 이름을 모두 올바르게 입력한 행이 최소 1개 이상 필요합니다.');
        return;
      }

      try {
        const res = await fetch(`${opener.API_BASE}/admin/users/register-students-bulk`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            schoolId: opener.currentUser.schoolId,
            students
          })
        });

        if (res.ok) {
          const data = await res.json();
          alert(`${data.registered.length}명의 학생이 성공적으로 등록 및 자동 가입되었습니다.`);
          
          // Clear input table and recreate 3 clean rows
          document.getElementById('student-input-rows').innerHTML = '';
          for(let i=0; i<3; i++) {
            addStudentInputRow();
          }

          loadApprovedStudents();
          opener.loadSchoolMetadata();
        } else {
          const data = await res.json();
          alert(data.error || '학생 등록에 실패했습니다.');
        }
      } catch (err) {
        console.error(err);
        alert('서버 통신 중 오류가 발생했습니다.');
      }
    }

    // Select all checkboxes
    document.getElementById('chk-select-all-students').addEventListener('change', (e) => {
      document.querySelectorAll('.student-checkbox').forEach(chk => {
        chk.checked = e.target.checked;
      });
    });

    // Bulk Delete Selected Students
    document.getElementById('btn-delete-selected-students').addEventListener('click', async () => {
      const selected = Array.from(document.querySelectorAll('.student-checkbox:checked')).map(chk => chk.value);
      if (selected.length === 0) {
        alert('삭제할 학생들을 먼저 선택해주세요.');
        return;
      }

      if (!confirm(`선택한 ${selected.length}명의 학생 계정을 정말로 삭제하시겠습니까?`)) {
        return;
      }

      try {
        const res = await fetch(`${opener.API_BASE}/admin/users?ids=${selected.join(',')}`, {
          method: 'DELETE'
        });
        if (res.ok) {
          alert('선택한 학생 계정이 삭제되었습니다.');
          loadApprovedStudents();
          opener.loadSchoolMetadata();
        } else {
          alert('삭제 처리에 실패했습니다.');
        }
      } catch (err) {
        console.error(err);
        alert('서버 통신 오류가 발생했습니다.');
      }
    });

    // Delete All Students
    document.getElementById('btn-delete-all-students').addEventListener('click', async () => {
      if (!confirm('🚨 경고: 학교에 등록된 모든 학생 계정이 영구 삭제됩니다. 정말로 전체 삭제하시겠습니까?')) {
        return;
      }

      try {
        const res = await fetch(`${opener.API_BASE}/admin/users?ids=ALL_STUDENTS&schoolId=${opener.currentUser.schoolId}`, {
          method: 'DELETE'
        });
        if (res.ok) {
          alert('학교의 모든 학생 계정이 삭제되었습니다.');
          loadApprovedStudents();
          opener.loadSchoolMetadata();
        } else {
          alert('전체 삭제 처리에 실패했습니다.');
        }
      } catch (err) {
        console.error(err);
        alert('서버 통신 오류가 발생했습니다.');
      }
    });

    window.onload = loadApprovedStudents;
  </script>
</body>
</html>
