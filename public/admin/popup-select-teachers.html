<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가입 완료 교사 목록 불러오기</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: var(--bg-surface);
      padding: 1.25rem;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .popup-container {
      max-width: 650px;
      margin: 0 auto;
      background: var(--bg-card);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <div class="popup-container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; border-bottom:1px solid var(--border-color); padding-bottom:0.75rem;">
      <h3 style="margin:0; font-size:1.2rem; color:var(--primary-color);">📋 가입 완료 교사 목록 불러오기</h3>
      <button type="button" class="btn btn-outline" onclick="window.close()" style="padding:0.35rem 0.8rem; font-size:0.85rem;">✕ 닫기</button>
    </div>

    <p style="font-size:0.88rem; color:var(--text-muted); margin-bottom:1rem;">
      시간표 설정에 포함시킬 선생님들을 체크한 후 <strong>[선택한 교사 적용]</strong> 버튼을 누르면 설정표에 바로 추가됩니다.
    </p>

    <div class="table-responsive" style="max-height: 360px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 8px;">
      <table class="logs-table">
        <thead>
          <tr>
            <th style="width: 45px; text-align: center;">
              <input type="checkbox" id="chk-all-teachers" onchange="toggleAllTeachers(this)" style="cursor:pointer;">
            </th>
            <th>교과</th>
            <th>이름</th>
            <th>로그인 아이디</th>
          </tr>
        </thead>
        <tbody id="select-teachers-table-body">
          <tr><td colspan="4" style="text-align:center; padding:1.5rem;">불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:1.25rem;">
      <span id="selected-count-label" style="font-size:0.9rem; font-weight:600; color:var(--primary-color);">0명 선택됨</span>
      <div style="display:flex; gap:0.5rem;">
        <button type="button" class="btn btn-outline" onclick="window.close()">취소</button>
        <button type="button" class="btn btn-primary" onclick="submitSelectedTeachers()" style="padding:0.55rem 1.5rem; font-weight:700;">⚡ 선택한 교사 적용</button>
      </div>
    </div>
  </div>

  <script>
    const opener = window.opener;
    if (!opener) {
      alert('올바르지 않은 접근입니다.');
      window.close();
    }

    let loadedTeachers = [];

    async function fetchTeachers() {
      const tbody = document.getElementById('select-teachers-table-body');
      try {
        const schoolId = opener.currentUser?.schoolId;
        if (!schoolId) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">학교 정보가 올바르지 않습니다.</td></tr>';
          return;
        }

        const res = await fetch(`${opener.API_BASE}/admin/teachers?schoolId=${schoolId}`);
        const teachers = await res.json();
        loadedTeachers = teachers || [];

        tbody.innerHTML = '';

        if (!teachers || teachers.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:1.5rem;">가입 완료된 교사가 없습니다.</td></tr>';
          return;
        }

        teachers.forEach((t, idx) => {
          const tr = document.createElement('tr');
          const subName = t.subject_name || t.subjectName || '-';
          const email = t.email || '-';

          tr.innerHTML = `
            <td style="text-align:center;">
              <input type="checkbox" class="chk-teacher-item" value="${t.id}" data-index="${idx}" onchange="updateSelectedCount()" style="cursor:pointer;">
            </td>
            <td><strong style="color:var(--primary-color);">${subName}</strong></td>
            <td><strong>${t.name}</strong> 선생님</td>
            <td><code>${email}</code></td>
          `;
          tbody.appendChild(tr);
        });

        updateSelectedCount();
      } catch (err) {
        console.error('Fetch error:', err);
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">교사 목록을 불러오는 중 오류가 발생했습니다.</td></tr>';
      }
    }

    window.toggleAllTeachers = function(mainChk) {
      document.querySelectorAll('.chk-teacher-item').forEach(chk => {
        chk.checked = mainChk.checked;
      });
      updateSelectedCount();
    };

    window.updateSelectedCount = function() {
      const checkedCount = document.querySelectorAll('.chk-teacher-item:checked').length;
      document.getElementById('selected-count-label').innerText = `${checkedCount}명 선택됨`;
    };

    window.submitSelectedTeachers = function() {
      const checkedBoxes = Array.from(document.querySelectorAll('.chk-teacher-item:checked'));
      if (checkedBoxes.length === 0) {
        alert('추가할 교사를 최소 1명 이상 선택해 주세요.');
        return;
      }

      const selectedList = checkedBoxes.map(chk => {
        const idx = parseInt(chk.getAttribute('data-index'));
        return loadedTeachers[idx];
      });

      if (opener && typeof opener.addGenRowsForTeachers === 'function') {
        opener.addGenRowsForTeachers(selectedList);
        alert(`선택하신 ${selectedList.length}명의 교사가 과목별 주간 시수 및 담당 교사 설정표에 추가되었습니다!`);
        window.close();
      } else {
        alert('부모 창과의 연동 오류가 발생했습니다.');
      }
    };

    fetchTeachers();
  </script>
</body>
</html>
