<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>👩‍🏫 교사 등록 및 관리</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3.0">
  <style>
    body { padding: 2rem; background: var(--bg-main); color: var(--text-main); font-family: 'Pretendard', sans-serif; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
    h2 { margin: 0; }
    .grid-container { display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; }
    .btn-danger { background: var(--danger-color, #dc2626); color: white; border: none; }
    .btn-danger:hover { background: #b91c1c; }
    .clickable-row { cursor: pointer; }
    .clickable-row:hover { background: var(--bg-card-hover, rgba(0,0,0,0.02)); }
  </style>
</head>
<body>
  <div class="header">
    <h2>👩‍🏫 교사 등록 및 관리</h2>
    <button class="btn btn-outline" onclick="window.close()">창 닫기</button>
  </div>

  <div class="grid-container">
    <!-- Left Column: Form -->
    <div class="settings-card" style="margin: 0; box-shadow: none; border: 1px solid var(--border-color);">
      <h4 id="form-title">👩‍🏫 교사 등록 / 정보 수정</h4>
      <p style="font-size:0.82rem; color:var(--text-muted); margin-bottom:1rem;">목록에서 교사를 클릭하면 정보를 수정할 수 있습니다.</p>
      <form id="teacher-setup-form">
        <input type="hidden" id="teacher-edit-id">
        <div class="form-group">
          <label>교사명</label>
          <input type="text" id="teacher-setup-name" class="form-input" required placeholder="예: 김교사">
        </div>
        <div class="form-group">
          <label>담당 과목명</label>
          <input type="text" id="teacher-setup-subject" class="form-input" placeholder="예: 수학">
        </div>
        <div class="form-group">
          <label>로그인 아이디 (아이디)</label>
          <input type="text" id="teacher-setup-email" class="form-input" required placeholder="예: teacher1">
        </div>
        <div class="form-group">
          <label>비밀번호</label>
          <input type="password" id="teacher-setup-password" class="form-input" required placeholder="예: 1234">
        </div>
        <div style="display:flex; gap:0.5rem; margin-top:1.5rem;">
          <button type="submit" class="btn btn-primary" style="flex:1;">정보 저장</button>
          <button type="button" class="btn btn-outline" id="btn-reset-form" style="display:none;">수정 취소</button>
        </div>
      </form>
    </div>

    <!-- Right Column: Teachers Table -->
    <div class="settings-card" style="margin: 0; box-shadow: none; border: 1px solid var(--border-color); display:flex; flex-direction:column; gap:1rem;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h4 style="margin:0;">👩‍🏫 등록 교사 목록</h4>
        <div style="display:flex; gap:0.5rem;">
          <button class="btn btn-sm btn-outline btn-danger" id="btn-delete-selected-teachers" style="padding:0.4rem 0.8rem; border-radius:4px;">선택 삭제</button>
          <button class="btn btn-sm" id="btn-delete-all-teachers" style="background:#b91c1c; color:white; border:none; padding:0.4rem 0.8rem; border-radius:4px;">전체 삭제</button>
        </div>
      </div>
      
      <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
        <table class="logs-table">
          <thead>
            <tr>
              <th style="width: 40px; text-align: center;"><input type="checkbox" id="chk-select-all-teachers"></th>
              <th>이름</th>
              <th>과목</th>
              <th>아이디</th>
              <th>비밀번호</th>
            </tr>
          </thead>
          <tbody id="admin-teachers-table-body">
            <!-- Dynamic -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const opener = window.opener;
    if (!opener) {
      alert('올바르지 않은 접근입니다.');
      window.close();
    }

    async function loadTeachers() {
      const tbody = document.getElementById('admin-teachers-table-body');
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">불러오는 중...</td></tr>';

      try {
        const res = await fetch(`${opener.API_BASE}/admin/teachers?schoolId=${opener.currentUser.schoolId}`);
        const teachers = await res.json();
        tbody.innerHTML = '';

        if (!teachers || teachers.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">등록된 교사가 없습니다.</td></tr>';
          return;
        }

        teachers.forEach(t => {
          const tr = document.createElement('tr');
          tr.className = 'clickable-row';
          
          // Row click to edit, but stop propagation if clicking checkbox
          tr.addEventListener('click', (e) => {
            if (e.target.type === 'checkbox') return;
            editTeacher(`${t.id}`, `${t.name}`, `${t.subject_name || t.subjectName || ''}`, `${t.email || ''}`, `${t.password_plain || ''}`);
          });

          tr.innerHTML = `
            <td style="text-align: center;"><input type="checkbox" class="teacher-checkbox" value="${t.id}"></td>
            <td><strong>${t.name}</strong></td>
            <td><span class="badge" style="background:var(--bg-card); color:var(--primary-color);">${t.subject_name || t.subjectName || '미지정'}</span></td>
            <td><span style="color:var(--text-muted); font-size:0.88rem;">${t.email || '-'}</span></td>
            <td><code style="background:var(--bg-card); padding:2px 5px; border-radius:3px;">${t.password_plain || '-'}</code></td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error(err);
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">불러오기 실패</td></tr>';
      }
    }

    window.editTeacher = function(id, name, subject, email, password) {
      document.getElementById('teacher-edit-id').value = id;
      document.getElementById('teacher-setup-name').value = name;
      document.getElementById('teacher-setup-subject').value = subject;
      document.getElementById('teacher-setup-email').value = email;
      document.getElementById('teacher-setup-password').value = password;
      
      document.getElementById('form-title').textContent = '👩‍🏫 교사 정보 수정';
      document.getElementById('btn-reset-form').style.display = 'inline-block';
    };

    document.getElementById('btn-reset-form').addEventListener('click', () => {
      resetForm();
    });

    function resetForm() {
      document.getElementById('teacher-setup-form').reset();
      document.getElementById('teacher-edit-id').value = '';
      document.getElementById('form-title').textContent = '👩‍🏫 교사 등록 / 정보 수정';
      document.getElementById('btn-reset-form').style.display = 'none';
    }

    document.getElementById('teacher-setup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const id = document.getElementById('teacher-edit-id').value;
      const name = document.getElementById('teacher-setup-name').value;
      const subjectName = document.getElementById('teacher-setup-subject').value;
      const email = document.getElementById('teacher-setup-email').value;
      const password = document.getElementById('teacher-setup-password').value;

      try {
        const res = await fetch(`${opener.API_BASE}/admin/teachers`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: id || null,
            schoolId: opener.currentUser.schoolId,
            name,
            subjectName,
            email,
            password
          })
        });

        const data = await res.json();
        if (res.ok) {
          alert('교사 정보가 성공적으로 저장되었습니다.');
          resetForm();
          loadTeachers();
          opener.loadSchoolMetadata();
        } else {
          alert(data.error || '교사 정보 저장 실패');
        }
      } catch (err) {
        console.error(err);
        alert('서버 통신 중 오류가 발생했습니다.');
      }
    });

    // Select all teachers checkbox
    document.getElementById('chk-select-all-teachers').addEventListener('change', (e) => {
      document.querySelectorAll('.teacher-checkbox').forEach(chk => {
        chk.checked = e.target.checked;
      });
    });

    // Bulk Delete Selected Teachers
    document.getElementById('btn-delete-selected-teachers').addEventListener('click', async () => {
      const selected = Array.from(document.querySelectorAll('.teacher-checkbox:checked')).map(chk => chk.value);
      if (selected.length === 0) {
        alert('삭제할 교사들을 먼저 선택해주세요.');
        return;
      }

      if (!confirm(`선택한 ${selected.length}명의 교사 정보 및 계정을 정말로 삭제하시겠습니까?`)) {
        return;
      }

      try {
        const res = await fetch(`${opener.API_BASE}/admin/teachers?ids=${selected.join(',')}`, {
          method: 'DELETE'
        });
        if (res.ok) {
          alert('선택한 교사 정보가 삭제되었습니다.');
          loadTeachers();
          opener.loadSchoolMetadata();
        } else {
          alert('교사 삭제에 실패했습니다.');
        }
      } catch (err) {
        console.error(err);
        alert('서버 통신 오류가 발생했습니다.');
      }
    });

    // Bulk Delete All Teachers
    document.getElementById('btn-delete-all-teachers').addEventListener('click', async () => {
      if (!confirm('🚨 경고: 학교의 모든 교사 정보 및 연결된 계정이 영구 삭제됩니다. 정말로 전체 삭제하시겠습니까?')) {
        return;
      }

      try {
        const res = await fetch(`${opener.API_BASE}/admin/teachers?ids=ALL_TEACHERS&schoolId=${opener.currentUser.schoolId}`, {
          method: 'DELETE'
        });
        if (res.ok) {
          alert('학교의 모든 교사 정보가 삭제되었습니다.');
          loadTeachers();
          opener.loadSchoolMetadata();
        } else {
          alert('전체 삭제 처리에 실패했습니다.');
        }
      } catch (err) {
        console.error(err);
        alert('서버 통신 오류가 발생했습니다.');
      }
    });

    window.onload = loadTeachers;
  </script>
</body>
</html>
